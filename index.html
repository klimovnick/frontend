<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontend 2.0</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Версия 2.0</h1>

    <h2>Сохранение данных</h2>

    <label for="text">Введите текст:</label>

    <input
        type="text"
        id="text"
        placeholder="Введите сообщение"
    >

    <button onclick="sendData()">Отправить</button>

    <p id="status"></p>

    <hr>

    <h2>Получение данных</h2>

    <button onclick="getData()">Получить данные</button>

    <textarea
        id="result"
        rows="10"
        readonly
        placeholder="Здесь появятся данные из data.txt"
    ></textarea>

</div>

<script src="script.js"></script>

</body>
</html>
